# pytest configuration for SAR Tracker plugin
# See CLAUDE.md for testing guidelines

[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test markers for categorizing tests
markers =
    qgis_required: Tests that require a real QGIS environment (deselect with '-m not qgis_required')
    slow: Tests that take longer to run (deselect with '-m not slow')
    integration: Integration tests that test multiple components together

# NOTE: pytest-qgis settings (qgis_gui_enabled, qgis_canvas_width, qgis_canvas_height)
# are only recognized when pytest-qgis is installed. Set them via command line:
#   pytest --qgis_disable_gui

# Logging
log_cli = false
log_cli_level = INFO

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
